<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0a101c">
<title>棒球 The Real</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;color:#fff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
canvas{display:block;cursor:crosshair}
.panel{position:absolute;background:rgba(10,16,28,.78);border:1px solid rgba(255,255,255,.12);border-radius:8px;backdrop-filter:blur(4px)}
#top{top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;padding:6px 16px;font-size:14px;white-space:nowrap}
#modeTag{font-weight:700;padding:3px 10px;border-radius:5px;background:#d9481c}
.cnt{display:flex;align-items:center;gap:4px;font-weight:700}
.cnt b{margin-left:8px;width:12px}
.cnt i{width:11px;height:11px;border-radius:50%;background:#333a46;display:inline-block}
.cnt i.on.b{background:#3fd36b}.cnt i.on.s{background:#ffd23a}.cnt i.on.o{background:#ff4141}
#pinfo{color:#9fd3ff;min-width:150px}
#side{top:10px;right:10px;width:240px;padding:12px;font-size:12.5px;line-height:1.65}
#side h1{font-size:17px;margin:0 0 8px;letter-spacing:.5px}
#side button,#pitchList button{font:inherit;cursor:pointer;border:0;border-radius:6px;color:#fff}
#side{width:auto;padding:8px 12px}#side h1{font-size:14px;margin:0;cursor:default}#side h1::after{content:' · 操作 ▾';font-weight:400;opacity:.6;font-size:12px}
#help{display:none;margin-top:6px;width:230px}#side:hover #help,body.touch.help #help{display:block}
#help div{display:flex;gap:8px}#help span:first-child{color:#ffb070;min-width:78px}
#msg{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:56px;font-weight:900;text-shadow:0 4px 18px rgba(0,0,0,.7);pointer-events:none;opacity:0}
#msg small{display:block;font-size:22px;font-weight:600;letter-spacing:2px;margin-top:4px}
#msg.show{animation:pop 2.6s ease forwards}
@keyframes pop{0%{opacity:0;transform:scale(1.4)}10%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
#speed{top:12px;left:14px;padding:8px 14px 9px;font-size:13px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap;min-width:120px}
#speed b{font-size:30px;font-variant-numeric:tabular-nums;margin-right:4px;line-height:1.1}#speed i{display:block;font-style:normal;font-weight:700;margin-top:2px}
#pinfo{display:none}
.bases{position:relative;width:34px;height:26px;display:inline-block}.bases i{position:absolute;width:9px;height:9px;transform:rotate(45deg);background:#333a46;border:1px solid #fff4}
.bases i:nth-child(1){right:2px;top:9px}.bases i:nth-child(2){left:12px;top:1px}.bases i:nth-child(3){left:2px;top:9px}.bases i.on{background:#ffd23a}
#runs{font-weight:700;color:#ffd23a;font-variant-numeric:tabular-nums}#cards{display:none!important}
#hitBox{right:10px;top:250px;width:214px;padding:10px 14px;font-size:12.5px;display:none;pointer-events:none}
#hitBox h3{margin:0 0 6px;font-size:16px;color:#ffd23a}#hitBox div{display:flex;justify-content:space-between;padding:3px 0;border-top:1px solid #ffffff14}
#hitBox b{font-variant-numeric:tabular-nums;font-size:14px}
#speed.show{opacity:1}
#hitInfo{position:absolute;top:calc(30% + 100px);left:0;right:0;text-align:center;font-size:18px;color:#ffe7a8;text-shadow:0 2px 8px #000;pointer-events:none}
#pitchList{bottom:16px;left:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
#pitchList button{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#253044;min-width:170px;text-align:left}
#pitchList button.sel{outline:2px solid #fff;background:#3b4b6a}
#pitchList kbd{background:#0008;border-radius:4px;padding:0 6px;font-family:inherit}
#pitchList .dot{width:10px;height:10px;border-radius:50%}
#meterBox{bottom:22px;left:50%;transform:translateX(-50%);padding:10px 14px;width:360px;font-size:12px}
#meter{position:relative;height:18px;background:#1b2230;border-radius:4px;overflow:hidden;margin-top:6px}
#mFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#3fd36b,#ffd23a)}
#mRed{position:absolute;right:0;top:0;bottom:0;background:repeating-linear-gradient(45deg,#c0262699,#c0262699 6px,#ff3b3baa 6px,#ff3b3baa 12px)}
#buntBox{bottom:22px;left:50%;transform:translateX(-50%);padding:8px 16px;font-size:14px;display:none}
#buntBox span{display:inline-block;width:26px;text-align:center;opacity:.3}#buntBox span.on{opacity:1;color:#ffb070;font-weight:900}
#cards{bottom:12px;right:10px;display:flex;font-size:13px}
#cards div{padding:6px 12px;min-width:150px}#cards div+div{border-left:1px solid #fff2}
#cards em{font-style:normal;color:#ffb070;font-weight:700;margin-right:6px}
#stam{height:6px;background:#1b2230;border-radius:3px;margin-top:4px;overflow:hidden}#stamFill{height:100%;background:#3fd36b}

/* ---------- game: score, intro, bullpen, coin toss, final ---------- */
#runs{color:#fff;font-weight:600}#runs b{color:#ffd23a;font-size:16px;font-variant-numeric:tabular-nums}#runs .inn{color:#9fd3ff;font-weight:800;margin-right:4px}
#intro{top:54px;left:50%;transform:translateX(-50%);padding:7px 14px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:1px;opacity:0;pointer-events:none;white-space:nowrap}
#intro b{font-size:15px}#intro i{font-style:normal;color:#9fd3ff;margin-top:2px}#intro.show{animation:intro 4.5s ease forwards}
@keyframes intro{0%{opacity:0}8%{opacity:1}80%{opacity:1}100%{opacity:0}}
#pHead{font-size:12px;padding:2px 4px 4px;min-width:170px}#pHead em{font-style:normal;color:#ffb070;margin:0 4px}#pHead span{opacity:.8}
.stam{height:5px;background:#1b2230;border-radius:3px;margin-top:4px;overflow:hidden}.stam i{display:block;height:100%}
#pitchList button.off{opacity:.28;pointer-events:none}#penBtn{background:#6b3fa0!important;justify-content:center;font-weight:700}
#pen{display:none;top:50%;left:50%;transform:translate(-50%,-50%);width:min(620px,94vw);max-height:84vh;overflow:auto;padding:14px 16px;z-index:20}
#pen h3{margin:0 0 2px;color:#ffd23a}#pen p{margin:0 0 10px;font-size:12px;opacity:.75}
#pen button{font:inherit;color:#fff;border:0;border-radius:7px;cursor:pointer}
#penList{display:flex;flex-direction:column;gap:6px}
.pr{display:grid;grid-template-columns:56px 1fr repeat(4,auto) 54px 92px;gap:8px;align-items:center;padding:8px 10px;background:#253044;text-align:left;font-size:12px}
.pr em{font-style:normal;color:#ffb070;font-weight:700}.pr b{font-size:14px}.pr.cur{outline:2px solid #3fd36b}.pr.off{opacity:.45;cursor:default}.pr .st{text-align:right;opacity:.85}
.pr .ars{display:flex;gap:3px}.pr .ars i{width:9px;height:9px;border-radius:50%}
#penClose{margin-top:10px;width:100%;padding:9px;background:#3b4b6a}
@media (max-width:640px){.pr{grid-template-columns:44px 1fr auto auto;font-size:11px}.pr span:nth-of-type(3),.pr span:nth-of-type(4){display:none}.pr .ars{display:none}}
#start,#final{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,8,16,.55);z-index:30;backdrop-filter:blur(2px)}
#final{display:none}
#start .box,#final .box{position:static;padding:22px 26px;text-align:center;max-width:92vw}
#start h1,#final h1{margin:0 0 6px;font-size:30px}.vs{margin:4px 0 12px}
#start button,#final button{font:inherit;font-weight:700;color:#fff;border:0;border-radius:8px;padding:11px 20px;margin:4px;cursor:pointer;background:#e8641f}
#coinBtns button{background:#253044}#playBall{display:none}
#coinWrap{perspective:600px;height:110px;display:flex;justify-content:center;align-items:center}
#coin{width:90px;height:90px;position:relative;transform-style:preserve-3d;transition:transform 1.7s cubic-bezier(.2,.7,.2,1)}
#coin .f{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:#5a3d00;
  background:radial-gradient(circle at 35% 30%,#fff3b0,#e8b923 55%,#a77a06);box-shadow:inset 0 0 0 5px #c89412;backface-visibility:hidden}
#coin .t{transform:rotateY(180deg)}#coinMsg{min-height:22px}
#finalLine{margin:10px auto 14px;border-collapse:collapse;font-variant-numeric:tabular-nums}#finalLine td,#finalLine th{padding:4px 8px;border-bottom:1px solid #ffffff22;text-align:center}
#finalLine th{text-align:left}
@media (max-width:520px){#intro{top:calc(46px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));transform:none;white-space:normal;width:calc(100vw - 76px);box-sizing:border-box;font-size:11px;align-items:flex-start}#intro b{font-size:13px}}
/* ---------- touch controls (phones / tablets) ---------- */
#touch{display:none}
body.touch #touch{display:block}
body.touch canvas{cursor:default}
.tbtn{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;border:2px solid rgba(255,255,255,.35);
  background:rgba(10,16,28,.55);backdrop-filter:blur(4px);color:#fff;font-weight:800;font-size:15px;line-height:1.1;text-align:center;touch-action:none;pointer-events:auto}
.tbtn small{font-size:10px;font-weight:600;letter-spacing:1px;opacity:.8}
.tbtn.on,.tbtn:active{background:rgba(232,100,31,.85);border-color:#fff}
#tSwing,#tPitch{width:104px;height:104px;right:calc(22px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));font-size:20px}
#tSwing{background:rgba(217,72,28,.7)}#tPitch{background:rgba(28,123,217,.7)}
#tBunt{width:64px;height:64px;right:calc(136px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));font-size:13px}
#tPen{width:58px;height:58px;right:calc(140px + env(safe-area-inset-right));bottom:calc(36px + env(safe-area-inset-bottom));font-size:13px}
#tDir{position:absolute;left:calc(16px + env(safe-area-inset-left));bottom:calc(30px + env(safe-area-inset-bottom));display:none;gap:10px}
#tDir .tbtn{position:static;width:58px;height:58px;font-size:20px}
#tTop{position:absolute;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));display:flex;gap:8px}
#tTop .tbtn{position:static;width:auto;height:34px;border-radius:17px;padding:0 12px;flex-direction:row;font-size:13px;gap:4px}
#tHint{position:absolute;left:0;right:0;bottom:calc(150px + env(safe-area-inset-bottom));text-align:center;font-size:13px;color:#fffc;text-shadow:0 1px 4px #000;pointer-events:none;transition:opacity .8s}
body.touch #side{display:none}
body.touch.help #side{display:block;top:calc(50px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));z-index:5}
body.touch .kb,body.touch #penBtn{display:none}
body.touch #buntBox{bottom:calc(150px + env(safe-area-inset-bottom))}
/* compact HUD on small or touch screens */
@media (max-width:900px),(max-height:560px){
  #top{top:calc(6px + env(safe-area-inset-top));gap:10px;padding:4px 10px;font-size:12px}
  #modeTag{padding:2px 7px}
  #speed{top:calc(6px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));padding:5px 10px;font-size:11px;min-width:0}#speed b{font-size:22px}
  #hitBox{top:auto;bottom:calc(150px + env(safe-area-inset-bottom));right:calc(8px + env(safe-area-inset-right));width:170px;padding:7px 10px;font-size:11px}#hitBox h3{font-size:13px}#hitBox b{font-size:12px}
  #msg{font-size:38px}#msg small{font-size:15px}
  #pitchList{left:calc(8px + env(safe-area-inset-left));bottom:calc(10px + env(safe-area-inset-bottom));flex-direction:row;flex-wrap:wrap;max-width:calc(100vw - 190px);padding:5px;gap:4px}
  #pitchList button{min-width:0;padding:6px 8px;font-size:12px;gap:5px}#pitchList small,#pitchList kbd{display:none}
  #meterBox{bottom:auto;top:calc(44px + env(safe-area-inset-top));width:min(300px,70vw);padding:6px 10px;font-size:11px}#meter{height:12px}
}
/* portrait phones: top bar would overflow, stack it under the speed box */
@media (max-width:520px){
  #top{left:calc(8px + env(safe-area-inset-left));transform:none;top:calc(6px + env(safe-area-inset-top))}
  #speed{top:calc(44px + env(safe-area-inset-top))}
  #tTop{flex-direction:column;align-items:flex-end;top:calc(44px + env(safe-area-inset-top))}
  #top{gap:7px;padding:4px 8px;font-size:11px}#modeTag .en{display:none}.cnt b{margin-left:4px}.cnt i{width:9px;height:9px}
  #meterBox{top:auto;bottom:calc(150px + env(safe-area-inset-bottom));left:calc(8px + env(safe-area-inset-left));transform:none;width:calc(100vw - 160px)}
  #tSwing,#tPitch{width:92px;height:92px}#tBunt{right:calc(122px + env(safe-area-inset-right))}
  #tPen{right:calc(38px + env(safe-area-inset-right));bottom:calc(132px + env(safe-area-inset-bottom))}
  #pitchList{max-width:calc(100vw - 136px)}#tHint{bottom:calc(210px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div id="top" class="panel"><span id="modeTag">打擊模式 BATTING</span><div class="cnt" id="cnt"></div><span id="bases" class="bases"><i></i><i></i><i></i></span><span id="runs">得分 0</span><span id="pinfo">—</span></div>
<div id="side" class="panel">
  <h1>棒球 The Real</h1>
  <div id="help"></div>
</div>
<div id="intro" class="panel"></div>
<div id="pen" class="panel"><h3>牛棚 BULLPEN</h3><p id="penNote"></p><div id="penList"></div><button id="penClose">關閉 Close</button></div>
<div id="start"><div class="box panel"><h1>棒球 The Real</h1>
  <p class="vs"><b style="color:#7fb0ff">鷹 Hawks</b>（你 YOU）&nbsp;vs&nbsp; <b style="color:#ff7a7a">彗星 Comets</b>（電腦 CPU）</p>
  <div id="coinWrap"><div id="coin"><div class="f">正</div><div class="f t">反</div></div></div>
  <p id="coinMsg">擲硬幣決定先攻 · Call the coin toss — win it and you bat first</p>
  <div id="coinBtns"><button data-c="0">正面 Heads</button><button data-c="1">反面 Tails</button></div>
  <button id="playBall">開始比賽 Play ball!</button></div></div>
<div id="final"><div class="box panel"><h1 id="finalTitle"></h1><table id="finalLine"></table><button onclick="location.reload()">再來一場 Play again</button></div></div>
<div id="speed" class="panel"></div><div id="msg"></div><div id="hitBox" class="panel"><h3 id="hbRes">擊球中…</h3><div><span>擊球初速 Exit velo</span><b id="hbExit"></b></div><div><span>仰角 Launch angle</span><b id="hbLa"></b></div><div><span>飛行距離 Distance</span><b id="hbDist"></b></div></div>
<div id="pitchList" class="panel"></div>
<div id="meterBox" class="panel"><div style="display:flex;justify-content:space-between"><span>投球力道 POWER<span class="kb">（按住左鍵）</span></span><span id="mTxt"></span></div><div id="meter"><div id="mFill"></div><div id="mRed"></div></div></div>
<div id="buntBox" class="panel">觸擊方向 BUNT &nbsp;<span id="bL">◀</span><span id="bC">●</span><span id="bR">▶</span></div>
<div id="touch">
  <div id="tTop"><button class="tbtn" id="tMute">🔊</button><button class="tbtn" id="tHelp">?</button></div>
  <div id="tHint">拖曳畫面移動球棒 · Drag to aim</div>
  <button class="tbtn" id="tSwing">揮棒<small>SWING</small></button>
  <button class="tbtn" id="tBunt">觸擊<small>BUNT</small></button>
  <div id="tDir"><button class="tbtn" data-d="a">◀</button><button class="tbtn" data-d="">●</button><button class="tbtn" data-d="d">▶</button></div>
  <button class="tbtn" id="tPitch">投球<small>HOLD</small></button>
  <button class="tbtn" id="tPen">牛棚<small>BULLPEN</small></button>
</div>
<div id="cards" class="panel"><div><em id="bNum"></em><span id="bName"></span><br><small>打者 BATTER</small></div><div><em>#18</em>陳柏翰<br><small>投手 PITCHER · <span id="pc">0</span> 球</small><div id="stam"><div id="stamFill"></div></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="mocap/clips.js"></script>
<script src="models/male.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const smooth=t=>t*t*(3-2*t);
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
const D2R=Math.PI/180, BR=0.037, WALL_H=3.2, UP=V(0,1,0);
const rw=t=>99+23*Math.cos(2*clamp(t,-Math.PI/4,Math.PI/4)); // outfield wall radius by spray angle

// ---------- renderer / scene ----------
const renderer=new THREE.WebGLRenderer({antialias:true});
const TOUCH=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0&&!matchMedia('(pointer:fine)').matches;
if(TOUCH)document.body.classList.add('touch');
renderer.setPixelRatio(Math.min(devicePixelRatio,TOUCH?1.5:2));   // phones/tablets: fewer pixels, steadier frame rate
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.05,2000);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t;}
const mat=(c,r=0.8,m=0)=>{const x=new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});x.color.convertSRGBToLinear();return x;};

scene.background=canvasTex(4,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#2f6fc8');gr.addColorStop(.55,'#8dbbe8');gr.addColorStop(1,'#e2eef8');g.fillStyle=gr;g.fillRect(0,0,w,h);});
scene.fog=new THREE.Fog(0xc9dcef,260,900);
scene.add(new THREE.HemisphereLight(0xe4f0ff,0x50703a,0.45));
{const pm=new THREE.PMREMGenerator(renderer),es=new THREE.Scene();
 es.add(new THREE.Mesh(new THREE.SphereGeometry(10,32,16),new THREE.MeshBasicMaterial({side:THREE.BackSide,map:canvasTex(4,256,(g,w,h)=>{
   const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#4f86d0');gr.addColorStop(.46,'#dfeaf6');gr.addColorStop(.54,'#8fa577');gr.addColorStop(1,'#3e5a2c');g.fillStyle=gr;g.fillRect(0,0,w,h);})})));
 scene.environment=pm.fromScene(es,.04).texture;}
const sun=new THREE.DirectionalLight(0xfff1dc,1.7);sun.position.set(-35,70,25);sun.castShadow=true;
sun.shadow.mapSize.set(TOUCH?1024:2048,TOUCH?1024:2048);Object.assign(sun.shadow.camera,{left:-26,right:26,top:26,bottom:-26,near:10,far:160});sun.shadow.bias=-0.0004;
sun.target.position.set(0,0,-10);scene.add(sun,sun.target);

// ---------- field ----------
const fieldTex=canvasTex(2048,2048,(g,S)=>{
  const sc=S/300,X=x=>(x+150)*sc,Z=z=>(z+210)*sc;
  g.fillStyle='#3d7c32';g.fillRect(0,0,S,S);
  g.save();g.translate(X(0),Z(0));g.rotate(Math.PI/4);
  for(let i=-50;i<50;i++){g.fillStyle=i%2?'rgba(255,255,255,.06)':'rgba(0,0,0,.05)';g.fillRect(i*6*sc,-S*2,6*sc,S*4);}
  for(let i=-50;i<50;i++){g.fillStyle=i%2?'rgba(255,255,255,.035)':'rgba(0,0,0,.035)';g.fillRect(-S*2,i*6*sc,S*4,6*sc);}
  g.restore();
  const dirt='#b37b4f';

    mitt(p=.7){if(!ok())return;burst(.09,'lowpass',1300+900*p,.8,.6+.5*p);tone(160,70,.1,.5*p);},
    glove(v=.5){if(!ok())return;burst(.07,'lowpass',1500,.8,.5*v);tone(150,80,.08,.3*v);},

  updateCamera(dt);
  if(aimReset&&TOUCH){camera.updateMatrixWorld();const v=V(0,.75,0).project(camera);mouse.set(v.x,v.y);}aimReset=false;  // touch aims relatively: start on the zone
}
function loop(){const dt=Math.min(clock.getDelta(),.05);update(dt);renderer.render(scene,camera);requestAnimationFrame(loop);}
// ---------- coin toss, then play ball ----------
beginHalf();
document.querySelectorAll('#coinBtns button').forEach(b=>b.onclick=()=>{SFX.init();const call=+b.dataset.c,r=Math.random()<.5?0:1,win=call===r;
  $('coinBtns').style.display='none';$('coinMsg').textContent='……';
  $('coin').style.transform=`rotateY(${1800+(r?180:0)}deg)`;
  setTimeout(()=>{G.home=win?1-USER:USER;   // the toss winner bats first (visitors)
    $('coinMsg').innerHTML=`${r?'反面':'正面'}！${win?'你猜對了':'猜錯了'} — <b>${TEAMS[1-G.home].zh}隊先攻</b> · ${win?'You bat first':'You pitch first'}`;
    $('playBall').style.display='inline-block';beginHalf();},1800);});
$('playBall').onclick=()=>{SFX.init();$('start').style.display='none';G.started=true;
  for(const T of TEAMS)T.staff[0].used=true;beginHalf();SFX.say('Play ball');};
loop();
</script>
